    <text x="292" y="155" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--accent)" stroke="none">listSkill</text>
    <text x="436" y="155" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" fill="var(--muted)" stroke="none">20 ids</text>

