    <path d="M 224 96 L 258 96" stroke="var(--muted)" stroke-width="1.6"/>
    <path d="M 250 90 L 258 96 L 250 102" stroke="var(--muted)" stroke-width="1.6"/>
    <text x="241" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="var(--muted)" stroke="none">load()</text>
