    </g>

    <path d="M 60 101 L 51 150 M 60 101 L 57 150 M 60 101 L 63 150 M 60 101 L 69 150 M 90 101 L 81 150 M 90 101 L 87 150 M 90 101 L 93 150 M 90 101 L 99 150 M 120 101 L 111 150 M 120 101 L 117 150 M 120 101 L 123 150 M 120 101 L 129 150 M 150 101 L 141 150 M 150 101 L 147 150 M 150 101 L 153 150 M 150 101 L 159 150 M 180 101 L 171 150 M 180 101 L 177 150 M 180 101 L 183 150 M 180 101 L 189 150" stroke="var(--muted)" stroke-width="1.2"/>
    <g fill="var(--muted)" stroke="none">
