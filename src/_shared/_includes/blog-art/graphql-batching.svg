    <rect x="282" y="18" width="164" height="26" rx="7" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="292" y="35" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--accent)" stroke="none">listCompany</text>

    <path d="M 300 44 L 300 78" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 4"/>
    <rect x="282" y="78" width="164" height="26" rx="7" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="292" y="95" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--accent)" stroke="none">listUser</text>
    <text x="436" y="95" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" fill="var(--muted)" stroke="none">5 ids</text>

    <path d="M 300 104 L 300 138" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 4"/>
