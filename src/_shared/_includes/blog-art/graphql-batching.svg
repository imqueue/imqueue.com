      <circle cx="81" cy="154" r="2.6"/><circle cx="87" cy="154" r="2.6"/><circle cx="93" cy="154" r="2.6"/><circle cx="99" cy="154" r="2.6"/>
      <circle cx="111" cy="154" r="2.6"/><circle cx="117" cy="154" r="2.6"/><circle cx="123" cy="154" r="2.6"/><circle cx="129" cy="154" r="2.6"/>
      <circle cx="141" cy="154" r="2.6"/><circle cx="147" cy="154" r="2.6"/><circle cx="153" cy="154" r="2.6"/><circle cx="159" cy="154" r="2.6"/>
      <circle cx="171" cy="154" r="2.6"/><circle cx="177" cy="154" r="2.6"/><circle cx="183" cy="154" r="2.6"/><circle cx="189" cy="154" r="2.6"/>
    </g>

    <text x="120" y="196" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="22" fill="var(--accent)" stroke="none">26</text>
    <text x="120" y="216" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--muted)" stroke="none">service calls</text>

