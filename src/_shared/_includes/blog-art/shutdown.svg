<svg class="post-illu" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- work still waiting in the queue, left untouched -->
    <rect x="24" y="119" width="22" height="22" rx="4" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="1.6"/>
    <rect x="52" y="119" width="22" height="22" rx="4" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="1.6"/>
    <rect x="80" y="119" width="22" height="22" rx="4" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="1.6"/>
    <text x="63" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--muted)" stroke="none">queued</text>

    <!-- intake closed: stop consuming -->
    <text x="122" y="92" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="var(--accent)" stroke="none">stop()</text>
    <path d="M 122 102 L 122 158" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- the one message already being handled, allowed to finish -->
    <rect x="152" y="100" width="140" height="60" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <rect x="211" y="119" width="22" height="22" rx="4" fill="var(--accent)" fill-opacity="0.45" stroke="var(--accent)" stroke-width="1.6"/>
    <text x="222" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--muted)" stroke="none">in flight</text>

    <path d="M 300 130 L 322 130" stroke="var(--accent)" stroke-width="2"/>
    <path d="M 316 125 L 322 130 L 316 135" stroke="var(--accent)" stroke-width="2"/>

    <!-- finished, then a clean exit -->
    <circle cx="352" cy="130" r="24" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <path d="M 342 130 L 349 137 L 363 123" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="352" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--muted)" stroke="none">done</text>

    <path d="M 382 130 L 404 130" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="436" cy="130" r="20" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
    <path d="M 436 118 L 436 130" stroke="var(--muted)" stroke-width="2.5"/>
    <path d="M 427 123 A 12 12 0 1 0 445 123" stroke="var(--muted)" stroke-width="2.5"/>
    <text x="436" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="var(--muted)" stroke="none">exit</text>
  </g>
</svg>
